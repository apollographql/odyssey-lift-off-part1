name: Format

on:
  push:
    branches:
      - main
      - typescript
      - upgrade/**
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root tooling
        run: npm ci
      - name: Check formatting
        run: npm run format:check
